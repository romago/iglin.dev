# Quick Estimate API for iglin.dev (Cloudflare Workers, free plan).
# Secrets are set with `npx wrangler secret put <NAME>`, see README.md.
name = "iglin-estimate-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "gemini" (free tier) or "claude" (paid Claude API key, not a Claude Max subscription).
AI_PROVIDER = "gemini"
# Tried in order (comma-separated). If all fail, the estimate comes from WORKERS_AI_MODEL.
GEMINI_MODELS = "gemini-flash-latest"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CLAUDE_MODEL = "claude-opus-5-5"
# Used to turn the AI's hour ranges into a price.
HOURLY_RATE = "50"
NOTIFY_TO = "roman@iglin.dev"
# Mail is sent through the PrivateEmail mailbox itself; its password is the SMTP_PASSWORD secret.
SMTP_HOST = "mail.privateemail.com"
SMTP_PORT = "465"
SMTP_USER = "roman@iglin.dev"
ALLOWED_ORIGINS = "https://iglin.dev,https://www.iglin.dev"
# The footer visit counter resets at midnight in this time zone.
VISITS_TIMEZONE = "America/New_York"

[ai]
binding = "AI"

# Per-IP limit on top of Turnstile: 3 requests a minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Visit counter for the iglin.dev footer (GET/POST /visits). Schema: migrations/.
[[d1_databases]]
binding = "DB"
database_name = "iglin-visits"
database_id = "f4d5f564-14e2-4071-b0b6-b72f8bff40d5"

[observability]
enabled = true
